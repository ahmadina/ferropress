name: Bug report
description: Ferropress behaves incorrectly or crashes
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen? If this is WordPress-observable, what does the reference WordPress installation do?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest set of steps, requests or fixtures that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ferropress commit or version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and traces
      description: Redact secrets, cookies, passwords and personal data before pasting.
      render: text
