[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false
version = "0.0.0"
license = "GPL-2.0-or-later"
repository = "https://github.com/ahmadina/ferropress"

[workspace.dependencies]
cms-cache = { path = "crates/cms-cache" }
cms-comments = { path = "crates/cms-comments" }
cms-content = { path = "crates/cms-content" }
cms-db = { path = "crates/cms-db" }
cms-options = { path = "crates/cms-options" }
cms-taxonomy = { path = "crates/cms-taxonomy" }
infra-mysql = { path = "crates/infra-mysql" }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "buffer-pool"] }
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
pcre2 = "0.2.11"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
test-harness = { path = "crates/test-harness" }
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
ambiguous_negative_literals = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
if_then_some_else_none = "warn"
empty_structs_with_brackets = "warn"
semicolon_outside_block = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"
