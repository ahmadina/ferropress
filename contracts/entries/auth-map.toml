schema = 1
id = "auth-map"
title = "Single-site capability mapping to primitives"
summary = """
A capability name is remapped to one or two primitives on a single site with no
object id. Anonymous actors cannot edit users. delete_site is always denied.
Other listed aliases follow the measured remaps. Names without a listed remap
keep their own name. Object-id, option, file-mod and network cases are not bound.
"""
upstream = [
    "wp-includes/capabilities.php",
]
evidence = [
    "contracts/auth/map.md",
]
implemented_in = ["crates/cms-auth"]
tests = [
    "crates/cms-auth/tests/map.rs::aliases_remap_to_primitives",
    "crates/cms-auth/tests/map.rs::anonymous_cannot_edit_users",
    "crates/cms-auth/tests/map.rs::can_uses_mapped_names",
    "crates/cms-auth/tests/map.rs::unavailable_store_is_an_error",
]

[covers]
functions = ["map_meta_cap"]
