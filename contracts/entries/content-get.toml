schema = 1
id = "content-get"
title = "Get one post row by id"
summary = """
A post id greater than zero is selected with SELECT * and LIMIT 1. The returned row is the
column bytes the server sent. A hit is remembered for the request; a miss is not. Zero is a
constructor error and does not hit the store.
"""
upstream = [
    "wp-includes/class-wp-post.php",
    "wp-includes/post.php",
]
evidence = [
    "contracts/content/get.md",
]
implemented_in = ["crates/cms-content"]
tests = [
    "crates/cms-content/tests/get.rs::select_then_get_from_the_bag",
    "crates/cms-content/tests/get.rs::a_miss_is_not_remembered",
    "crates/cms-content/tests/get.rs::null_cells_become_empty_bytes",
    "crates/cms-content/tests/get.rs::unavailable_store_is_an_error",
]

[covers]
tables = ["posts"]
