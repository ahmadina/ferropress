schema = 1
id = "query-date"
title = "Parse year, monthnum and day into archive-date flags"
summary = """
year, monthnum and day are stored as absint. Flags resolve in day, month,
year order. An invalid Gregorian day with month and year is a 404; a month
greater than 12 is a 404. A later step can still set is_date after a 404.
m, w and time keys are not bound.
"""
upstream = [
    "wp-includes/class-wp-query.php",
    "wp-includes/functions.php",
    "wp-includes/query.php",
]
evidence = [
    "contracts/query/date.md",
]
implemented_in = ["crates/cms-query"]
tests = [
    "crates/cms-query/tests/date.rs::missing_empty_and_zero_are_not_a_date",
    "crates/cms-query/tests/date.rs::year_only_is_a_year",
    "crates/cms-query/tests/date.rs::month_wins_over_year",
    "crates/cms-query/tests/date.rs::valid_day_is_a_day",
    "crates/cms-query/tests/date.rs::invalid_day_falls_through_to_month",
    "crates/cms-query/tests/date.rs::month_over_twelve_is_not_found",
]

[covers]
functions = ["is_date", "is_year", "is_month", "is_day"]
