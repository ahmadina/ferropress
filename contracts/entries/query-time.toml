schema = 1
id = "query-time"
title = "Parse m, w and time into archive-date flags"
summary = """
m keeps digits; w is absint; hour, minute and second stay empty or become
absint. A present clock value is is_time and is_date and skips the calendar
404. m length adds is_time, is_day, is_month or is_year. w only sets is_date.
SQL is not bound.
"""
upstream = [
    "wp-includes/class-wp-query.php",
    "wp-includes/query.php",
]
evidence = [
    "contracts/query/time.md",
]
implemented_in = ["crates/cms-query"]
tests = [
    "crates/cms-query/tests/time.rs::missing_empty_are_not_time",
    "crates/cms-query/tests/time.rs::present_clock_is_time",
    "crates/cms-query/tests/time.rs::time_blocks_calendar_404",
    "crates/cms-query/tests/time.rs::stamp_length_picks_the_flag",
    "crates/cms-query/tests/time.rs::stamp_zero_is_not_a_date",
    "crates/cms-query/tests/time.rs::week_is_date_without_calendar",
    "crates/cms-query/tests/time.rs::stamp_stacks_on_time",
]

[covers]
functions = ["is_time"]
