schema = 1
id = "taxonomy-write"
title = "Insert, update and delete term rows"
summary = """
Insert writes a terms row then a term_taxonomy row and returns both new ids.
Update rewrites name/slug/term_group and the taxonomy description/parent.
Delete removes the taxonomy row and the terms row when no taxonomy remains.
Integer columns are unquoted; other cells are quoted MySQL strings. Server
rejection and zero affected rows are unchanged; a platform error is not.
"""
upstream = [
    "wp-includes/taxonomy.php",
    "wp-includes/class-wpdb.php",
]
evidence = [
    "contracts/taxonomy/write.md",
]
implemented_in = ["crates/cms-taxonomy"]
tests = [
    "crates/cms-taxonomy/tests/write.rs::insert_returns_both_new_ids",
    "crates/cms-taxonomy/tests/write.rs::update_rewrites_and_forgets_a_hit",
    "crates/cms-taxonomy/tests/write.rs::delete_removes_a_last_taxonomy",
    "crates/cms-taxonomy/tests/write.rs::delete_keeps_a_shared_term_row",
]

[covers]
tables = ["terms", "term_taxonomy"]
