# Lab-only virtual hosts, one per profile; lab/app/config.php selects the installation from LAB_PROFILE.
Listen 8081

<VirtualHost *:80>
	DocumentRoot /var/www/html
	SetEnv LAB_PROFILE single
	# Answered by Apache itself: health checks must never run the application, whose first visit after
	# an install changes the database.
	RewriteEngine On
	RewriteRule ^/ferropress-lab-health$ - [R=204,L]
</VirtualHost>

# A subdirectory network serves every site from one front controller.
<VirtualHost *:8081>
	DocumentRoot /var/www/html
	SetEnv LAB_PROFILE network
	<Directory /var/www/html>
		FallbackResource /index.php
	</Directory>
</VirtualHost>
