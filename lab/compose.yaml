# Reference lab stack. Start it with `cargo xtask lab up`, which supplies the pinned LAB_* values from
# contracts/reference-manifest.toml. Lab-only credentials; nothing is reachable beyond localhost.
name: ferropress-lab

services:
  database:
    image: ${LAB_DB_IMAGE:?run through cargo xtask lab}
    environment:
      MYSQL_DATABASE: reference
      MYSQL_USER: reference
      MYSQL_PASSWORD: reference
      MYSQL_ROOT_PASSWORD: reference-root
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=reference", "--password=reference", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  app:
    build:
      context: app
      args:
        LAB_PHP_IMAGE: ${LAB_PHP_IMAGE:?run through cargo xtask lab}
        LAB_PLATFORM_URL: ${LAB_PLATFORM_URL:?run through cargo xtask lab}
        LAB_PLATFORM_SHA256: ${LAB_PLATFORM_SHA256:?run through cargo xtask lab}
    image: ferropress-lab-app:local
    # The upstream checkouts, read-only, for corpus checks such as `cargo xtask lab lexer-corpus`.
    volumes:
      - ./upstream:/opt/upstream:ro
    depends_on:
      database:
        condition: service_healthy
    environment:
      LAB_DB_NAME: reference
      LAB_DB_USER: reference
      LAB_DB_PASSWORD: reference
      LAB_DB_HOST: database
      # Wall-clock time for every process in the app container: starts at this instant and advances one
      # microsecond per clock read, never with real time. A fully frozen clock is not usable because
      # PHP's uniqid() waits for the clock to move.
      FAKETIME: "@2026-01-01 00:00:00 i0.000001"
    # One port per profile: single site on 8080, network of sites on 8081.
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost/ferropress-lab-health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  database:
